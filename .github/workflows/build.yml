name: Build mod
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: "rut9-fabric-1.21.8-source (1)/rut9"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Build
        run: gradle build --stacktrace 2>&1 | tee build.log
      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: "rut9-fabric-1.21.8-source (1)/rut9/build.log"
          if-no-files-found: ignore
      - name: Upload mod
        uses: actions/upload-artifact@v4
        with:
          name: rut9-mod
          path: "rut9-fabric-1.21.8-source (1)/rut9/build/libs/*.jar"
